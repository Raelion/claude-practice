<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello from Ian</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      box-sizing: border-box;
      text-align: center;
      background: #121212;
      color: #f5f5f5;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    h1 {
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0 0 2.5rem;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr));
      gap: 1.25rem;
      width: 100%;
      max-width: 900px;
    }
    .card {
      background: #1e1e1e;
      border: 1px solid #2c2c2c;
      border-radius: 12px;
      padding: 1.75rem 1.5rem;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    @media (hover: hover) {
      .card:hover {
        transform: translateY(-4px);
        border-color: #4a4a4a;
      }
    }
    .card h2 {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0 0 0.5rem;
    }
    .card p {
      margin: 0;
      color: #a8a8a8;
      line-height: 1.5;
    }
    @media (max-width: 600px) {
      body {
        justify-content: flex-start;
        padding: 3rem 1rem 2rem;
      }
      h1 {
        margin-bottom: 1.75rem;
      }
      .cards {
        gap: 1rem;
      }
      .card {
        padding: 1.25rem;
      }
    }
  </style>
</head>
<body>
  <h1>Hello from Ian</h1>

  <section class="cards">
    <div class="card">
      <h2>Web Infrastructure</h2>
      <p>Building and running the systems that keep sites fast and reliable.</p>
    </div>
    <div class="card">
      <h2>Networking</h2>
      <p>Designing and troubleshooting the connections between everything.</p>
    </div>
    <div class="card">
      <h2>DJing</h2>
      <p>Mixing tracks and reading the room to keep the floor moving.</p>
    </div>
  </section>
</body>
</html>
